
name: Windows VST3 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.10
          path: JUCE

      - name: Configure VST3
        shell: pwsh
        run: |
          $project = Get-ChildItem -Recurse -Filter CMakeLists.txt |
            Where-Object { $_.FullName -notmatch '[\\/]JUCE[\\/]' } |
            Select-Object -First 1
          if (-not $project) { throw "CMakeLists.txt not found" }
          cmake -S "$($project.Directory.FullName)" -B build -A x64 -DJUCE_DIR="${{ github.workspace }}/JUCE"

      - name: Build VST3
        run: cmake --build build --config Release

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: 404-Modular-VST3
          path: build/**/*.vst3/**
          if-no-files-found: error
