name: Windows VST3 Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build VST3
        run: cmake --build build --config Release --parallel 2
      - name: Package VST3
        shell: pwsh
        run: |
          $plugins = @(Get-ChildItem -Path build -Filter '*.vst3' -Recurse -Directory | Where-Object { $_.FullName -notmatch '\\Contents\\' })
          if ($plugins.Count -eq 0) { throw 'No .vst3 bundle found' }
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          foreach ($plugin in $plugins) { Copy-Item -Path $plugin.FullName -Destination artifact -Recurse -Force }
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: 404-Modular-MKII-Windows-VST3
          path: artifact/
          if-no-files-found: error
